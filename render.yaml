services:
  - type: web
    name: onebreathleft
    env: python
    buildCommand: |
      python --version
      pip install --upgrade pip
      pip install -r requirements-web.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
