<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Breath Left - Psychological Survival Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0f0f14;
            color: #c8c8d2;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }
        
        #gameCanvas {
            border: 2px solid #282830;
            background: #0f0f14;
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 80vh;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        
        .stat-bar {
            margin-bottom: 10px;
            width: 250px;
        }
        
        .stat-label {
            font-size: 14px;
            margin-bottom: 3px;
        }
        
        .bar-bg {
            width: 100%;
            height: 20px;
            background: #282830;
            border: 1px solid #404050;
        }
        
        .bar-fill {
            height: 100%;
            transition: width 0.3s;
        }
        
        .health-fill { background: #64b464; }
        .stamina-fill { background: #6496b4; }
        .fear-fill { background: #b46482; }
        
        #trustIndicator {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            z-index: 10;
        }
        
        #adviceBox {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            max-width: 90%;
            background: rgba(20, 25, 35, 0.9);
            border: 2px solid #96b4c8;
            padding: 15px;
            border-radius: 5px;
            display: none;
            z-index: 10;
        }
        
        #adviceText {
            font-size: 16px;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        #adviceButtons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        button {
            background: #282830;
            color: #c8c8d2;
            border: 1px solid #404050;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        button:hover {
            background: #383840;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: #646470;
            z-index: 10;
        }
        
        #endingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 20;
        }
        
        #endingTitle {
            font-size: 36px;
            margin-bottom: 30px;
        }
        
        #endingStats {
            font-size: 16px;
            line-height: 2;
        }
        
        #loadingContent {
            text-align: center;
        }
        
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f0f14;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div id="loadingContent">
            <h1>One Breath Left</h1>
            <p>Loading...</p>
        </div>
    </div>
    
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="ui">
            <div class="stat-bar">
                <div class="stat-label">Health: <span id="healthText">100</span></div>
                <div class="bar-bg">
                    <div class="bar-fill health-fill" id="healthBar" style="width: 100%"></div>
                </div>
            </div>
            <div class="stat-bar">
                <div class="stat-label">Stamina: <span id="staminaText">100</span></div>
                <div class="bar-bg">
                    <div class="bar-fill stamina-fill" id="staminaBar" style="width: 100%"></div>
                </div>
            </div>
            <div class="stat-bar">
                <div class="stat-label">Fear: <span id="fearText">0</span></div>
                <div class="bar-bg">
                    <div class="bar-fill fear-fill" id="fearBar" style="width: 0%"></div>
                </div>
            </div>
        </div>
        
        <div id="trustIndicator">
            <div style="font-size: 14px;">Trust: <span id="trustText">50</span>%</div>
            <div style="font-size: 12px; margin-top: 5px;">Time: <span id="timeText">0</span>s</div>
        </div>
        
        <div id="adviceBox">
            <div id="adviceText"></div>
            <div id="adviceButtons">
                <button onclick="acceptAdvice()">Follow (Y)</button>
                <button onclick="rejectAdvice()">Ignore (N)</button>
            </div>
        </div>
        
        <div id="controls">
            WASD / Arrow Keys: Move | Shift: Run | Y: Accept | N: Reject
        </div>
        
        <div id="endingScreen">
            <div id="endingTitle"></div>
            <div id="endingStats"></div>
            <button onclick="location.reload()" style="margin-top: 30px;">Play Again</button>
        </div>
    </div>
    
    <script src="/static/game.js"></script>
</body>
</html>
